<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f4" />
    <meta name="description" content="Will Treinos — organização das aulas de vôlei e da comunidade do Ouro Verde." />
    <title>Will Treinos · Gestão da comunidade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#inicio" aria-label="Will Treinos, início">
          <span class="brand-mark"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 12.5c5.8 1.8 10.2 6.8 10.1 15.3M28.8 10.7c-1.1 6.9-5.8 12.7-13 15.1M11.8 29c5.9-3.8 13.1-4.6 19.5-1.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="m10.6 12.4 5.2.4M28.8 10.6l2.7 4.5M31.3 27.4l-.8 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
          <span class="brand-copy"><strong>will treinos</strong><small>vôlei que aproxima</small></span>
        </a>
        <div class="workspace-label">ESPAÇO DO PROJETO</div>
        <nav class="main-nav" aria-label="Navegação principal">
          <button class="nav-item active" data-view="inicio"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/></svg></span>Visão geral</button>
          <button class="nav-item" data-view="alunos"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M16 20v-1.7a3.3 3.3 0 0 0-3.3-3.3H7.3A3.3 3.3 0 0 0 4 18.3V20M10 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM16 4.2a3.5 3.5 0 0 1 0 6.8M20 20v-1.7a3.3 3.3 0 0 0-2.5-3.2"/></svg></span>Alunos <span class="nav-count" id="student-count">24</span></button>
          <button class="nav-item" data-view="agenda"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="15" rx="2"/><path d="M7.5 3.5v4M16.5 3.5v4M3.5 10h17M8 14h2M14 14h2M8 17h2"/></svg></span>Agenda</button>
          <button class="nav-item" data-view="presenca"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 5.5h16v13H4zM8 9l2.5 2.5L16 7M8 15h8"/></svg></span>Presença</button>
          <button class="nav-item" data-view="campeonatos"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M8 4h8v4a4 4 0 0 1-8 0V4ZM8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4M12 12v5M8 21h8M10 17h4"/></svg></span>Campeonatos</button>
          <div class="nav-divider"></div>
          <div class="workspace-label secondary-label">COMUNIDADE</div>
          <button class="nav-item" data-view="avisos"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg></span>Avisos <span class="unread-dot"></span></button>
          <button class="nav-item" data-view="equipe"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 20v-1.7A3.3 3.3 0 0 1 6.8 15h4.4a3.3 3.3 0 0 1 3.3 3.3V20M16 5.3a3 3 0 0 1 0 5.8M17 15h.2a3.3 3.3 0 0 1 3.3 3.3V20"/></svg></span>Equipe</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="help-card"><div class="help-icon">?</div><div><strong>Precisa de ajuda?</strong><span>Fale com a equipe</span></div><span class="help-arrow">↗</span></div>
          <button class="profile-button" id="profile-button"><span class="avatar avatar-w">W</span><span class="profile-copy"><strong>Willian</strong><small>Professor · administrador</small></span><span class="profile-more">···</span></button>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="Abrir menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
          <div class="breadcrumbs"><span>Will Treinos</span><span class="crumb-slash">/</span><strong id="breadcrumb-current">Visão geral</strong></div>
          <div class="topbar-actions"><span class="today-label" id="today-label"></span><button class="icon-button notification-button" aria-label="Notificações"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg><i></i></button><span class="topbar-divider"></span><span class="avatar avatar-w small-avatar">W</span></div>
        </header>
        <div class="content-wrap" id="content"></div>
        <footer class="footer"><span>Will Treinos <span class="footer-dot">·</span> Ouro Verde, Campinas</span><span>Feito para fortalecer a comunidade <span class="heart">♥</span></span></footer>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="modal-backdrop" id="modal-backdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><span class="eyebrow">WILL TREINOS</span><h2 id="modal-title">Adicionar aluno</h2></div><button class="icon-button close-modal" aria-label="Fechar">×</button></div><form id="student-form"><label>Nome completo<input name="name" required placeholder="Ex.: Marina Oliveira" /></label><div class="form-row"><label>Faixa etária<select name="group"><option>Adultos</option><option>Infantil</option><option>Juvenil</option></select></label><label>Turma<select name="class"><option>Vôlei · Iniciante</option><option>Vôlei · Intermediário</option><option>Vôlei · Infantil</option></select></label></div><label>Contato do responsável<input name="contact" placeholder="(19) 99999-0000" /></label><div class="modal-actions"><button type="button" class="button button-light close-modal">Cancelar</button><button type="submit" class="button button-primary">Salvar aluno <span>↗</span></button></div></form></section></div>
    <script src="./app.js" defer></script>
  </body>
</html>
